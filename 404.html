<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>404 — Сторінку не знайдено | С-АСА КОНСАЛТИНГ</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/png" href="/LOGO.png">
    <link rel="apple-touch-icon" href="/LOGO.png">

    <!-- Шрифти -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, ::before, ::after {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid;
            border-color: rgba(24, 24, 27, 0.1);
        }
        html {
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            width: 100%;
        }
        body {
            margin: 0;
            min-height: 100vh;
            width: 100%;
            background-color: #FAF9F6;
            color: #18181B;
            font-weight: 300;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }
        h1, p { margin: 0; padding: 0; }
        a { color: inherit; text-decoration: inherit; }
        img, svg { display: block; max-width: 100%; height: auto; }
        ::selection { background-color: #B89B72; color: #ffffff; }

        /* Шапка */
        header {
            width: 100%;
            padding-top: env(safe-area-inset-top, 0px);
            border-bottom: 1px solid rgba(24, 24, 27, 0.1);
            background-color: rgba(250, 249, 246, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
        }
        .container {
            max-width: 80rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 5.5rem;
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 0.875rem;
        }
        .logo-img {
            height: 3rem;
            width: auto;
            object-fit: contain;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-link:hover .logo-img { transform: scale(1.04); }
        .logo-text-wrap {
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(24, 24, 27, 0.15);
            padding-left: 0.875rem;
        }
        .logo-title {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 1.375rem;
            letter-spacing: 0.2em;
            font-weight: 500;
            line-height: 1;
        }
        .logo-sub {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: #52525B;
            margin-top: 0.3rem;
        }

        /* Контент 404 */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 4rem 1.5rem;
            z-index: 10;
        }
        .content-box {
            max-width: 38rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .badge-line {
            width: 2rem;
            height: 1px;
            background-color: #B89B72;
        }
        .badge-text {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #9A7B50;
            font-weight: 500;
        }
        .error-code {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(5rem, 14vw, 9.5rem);
            font-weight: 400;
            line-height: 0.9;
            color: #18181B;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }
        .error-code span {
            font-style: italic;
            color: #9A7B50;
        }
        .error-title {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 400;
            margin-bottom: 1rem;
            color: #18181B;
        }
        .error-desc {
            font-size: 0.95rem;
            color: #52525B;
            line-height: 1.65;
            margin-bottom: 2.5rem;
        }
        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background-color: #18181B;
            color: #FAF9F6;
            padding: 1rem 2.25rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: background-color 0.4s ease;
            width: 100%;
            max-width: 18rem;
        }
        .btn-primary:hover { background-color: #9A7B50; }
        .btn-primary svg {
            width: 1rem;
            height: 1rem;
            transition: transform 0.3s ease;
        }
        .btn-primary:hover svg { transform: translateX(-4px); }

        /* Фонова графіка */
        .bg-graphic {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(680px, 92vw);
            height: min(680px, 92vw);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }
        @keyframes rotateSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .svg-orbit { animation: rotateSlow 60s linear infinite; transform-origin: center; }

        /* Підвал */
        footer {
            border-top: 1px solid rgba(24, 24, 27, 0.1);
            padding: 1.75rem 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #52525B;
            letter-spacing: 0.05em;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 640px) {
            .actions { flex-direction: row; }
            .btn-primary { width: auto; }
        }
        @media (prefers-reduced-motion: reduce) {
            .svg-orbit { animation: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-inner">
            <a href="/" class="logo-link" aria-label="С-АСА КОНСАЛТИНГ — На головну">
                <img src="/LOGO.png" alt="С-АСА КОНСАЛТИНГ" class="logo-img" width="120" height="48">
                <div class="logo-text-wrap">
                    <span class="logo-title">С-АСА</span>
                    <span class="logo-sub">Консалтинг</span>
                </div>
            </a>
        </div>
    </header>

    <main>
        <div class="bg-graphic" aria-hidden="true">
            <svg viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="300" cy="300" r="280" stroke="#B89B72" stroke-width="0.6" stroke-dasharray="3 6" class="svg-orbit"/>
                <circle cx="300" cy="300" r="210" stroke="#18181B" stroke-width="0.4" stroke-opacity="0.2"/>
                <ellipse cx="300" cy="300" rx="260" ry="90" transform="rotate(-28 300 300)" stroke="#18181B" stroke-width="0.5" stroke-opacity="0.2"/>
                <ellipse cx="300" cy="300" rx="260" ry="90" transform="rotate(32 300 300)" stroke="#B89B72" stroke-width="0.6" stroke-opacity="0.45"/>
            </svg>
        </div>

        <div class="content-box">
            <div class="badge">
                <span class="badge-line"></span>
                <span class="badge-text">Помилка маршрутизації</span>
                <span class="badge-line"></span>
            </div>

            <div class="error-code">4<span>0</span>4</div>

            <h1 class="error-title">Запитану сторінку не знайдено</h1>

            <p class="error-desc">
                Можливо, посилання застаріло або в адресі допущено неточність. Поверніться на головну сторінку для ознайомлення з послугами автоматизації 1С / BAS.
            </p>

            <div class="actions">
                <a href="/" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M19 12H5M11 19l-7-7 7-7"/>
                    </svg>
                    <span>На головну сторінку</span>
                </a>
            </div>
        </div>
    </main>

    <footer>
        &copy; <span id="year">2026</span> С-АСА КОНСАЛТИНГ. Всі права захищені.
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
